<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="星纪">
  <meta name="theme-color" content="#faf7f0">
  <meta name="description" content="AI 对话、记忆收藏与心情能量波动记录的个人小工作台">
  <title>星纪</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="wallpaper-layer" aria-hidden="true"></div>
  <div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>
  <div id="ambient-corner" class="ambient-corner" aria-hidden="true"></div>

  <div id="splash-screen" class="splash-screen" aria-hidden="true">
    <div id="splash-photo-bg" class="splash-photo-bg"></div>
    <canvas id="splash-canvas"></canvas>
    <div class="splash-veil"></div>
    <div id="splash-datetime" class="splash-datetime">
      <div id="splash-time" class="splash-time"></div>
      <div id="splash-date" class="splash-date"></div>
    </div>
    <div class="splash-content">
      <div id="splash-welcome" class="splash-welcome">Welcome Home</div>
    </div>
    <div id="splash-home" class="splash-home">
      <div class="splash-progress"><div id="splash-progress-fill" class="splash-progress-fill"></div></div>
      <svg class="splash-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
      <div class="splash-hint">向上轻滑以进入</div>
      <div class="splash-bar"></div>
    </div>
  </div>

  <div id="page-stack" class="page-stack"></div>

  <div id="app-shell" class="app-shell">
    <div id="offline-banner" class="offline-banner">当前处于离线状态，本地记录仍可正常查看和编辑，AI 对话需要联网。</div>

    <main class="app-main">
      <section id="view-chat" class="view active"></section>
      <section id="view-bookmarks" class="view"></section>
      <section id="view-mood" class="view"></section>
      <section id="view-calendar" class="view"></section>
      <section id="view-more" class="view"></section>
      <section id="view-resources" class="view"></section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn" data-tab="bookmarks" title="Memory" aria-label="Memory">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
          <g transform="translate(9.5,15) scale(0.6)"><path d="M0,-7.5 A7.5,7.5 0 1,1 0,7.5 A3.2,7.5 0 1,0 0,-7.5 Z" fill="currentColor" stroke="none"/></g>
          <path d="M16.50,4.60 L17.14,6.36 L18.90,7.00 L17.14,7.64 L16.50,9.40 L15.86,7.64 L14.10,7.00 L15.86,6.36 Z" fill="currentColor" stroke="none"/>
          <circle cx="20" cy="11" r="0.5" fill="currentColor" stroke="none"/>
          <circle cx="19" cy="16.5" r="0.4" fill="currentColor" stroke="none"/>
          <circle cx="6" cy="7.5" r="0.45" fill="currentColor" stroke="none"/>
        </svg></span>
      </button>
      <button class="nav-btn" data-tab="mood" title="Mood" aria-label="Mood">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round">
          <circle cx="12" cy="12" r="2.8" fill="currentColor" stroke="none"/>
          <circle cx="12" cy="12" r="6.1" stroke-width="1.1" opacity="0.75"/>
          <circle cx="12" cy="12" r="9.4" stroke-width="1" opacity="0.4"/>
        </svg></span>
      </button>
      <button class="nav-btn nav-btn-center" data-tab="chat" title="Home" aria-label="Home">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <path d="M12.00,2.80 L13.53,8.30 L18.51,5.49 L15.70,10.47 L21.20,12.00 L15.70,13.53 L18.51,18.51 L13.53,15.70 L12.00,21.20 L10.47,15.70 L5.49,18.51 L8.30,13.53 L2.80,12.00 L8.30,10.47 L5.49,5.49 L10.47,8.30 Z"/>
        </svg></span>
      </button>
      <button class="nav-btn" data-tab="calendar" title="Calendar" aria-label="Calendar">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.4" y="4.8" width="17.2" height="15.2" rx="2"/><path d="M3.4 9.4h17.2M8 3.4v3M16 3.4v3"/>
        </svg></span>
      </button>
      <button class="nav-btn" data-tab="more" title="Settings" aria-label="Settings">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <path d="M12.00,4.90 L13.20,9.53 L17.23,6.85 L14.85,11.09 L19.45,12.00 L14.85,12.91 L17.23,17.15 L13.20,14.47 L12.00,19.10 L10.80,14.47 L6.77,17.15 L9.15,12.91 L4.55,12.00 L9.15,11.09 L6.77,6.85 L10.80,9.53 Z" transform="scale(0.82) translate(2.6,2.6)"/>
          <circle cx="20.5" cy="15.2" r="0.55"/>
          <circle cx="15.2" cy="20.5" r="0.55"/>
          <circle cx="8.8" cy="20.5" r="0.55"/>
          <circle cx="3.5" cy="15.2" r="0.55"/>
          <circle cx="3.5" cy="8.8" r="0.55"/>
          <circle cx="8.8" cy="3.5" r="0.55"/>
          <circle cx="15.2" cy="3.5" r="0.55"/>
          <circle cx="20.5" cy="8.8" r="0.55"/>
        </svg></span>
      </button>
    </nav>
  </div>

  <script src="js/db.js"></script>
  <script src="js/crypto-utils.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/ui-dialog.js"></script>
  <script src="js/wallpaper.js"></script>
  <script src="js/splash-photo.js"></script>
  <script src="js/avatars.js"></script>
  <script src="js/resources.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/memory.js"></script>
  <script src="js/proactive.js"></script>
  <script src="js/linkstatus.js"></script>
  <script src="js/bookmarks.js"></script>
  <script src="js/mood.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/more.js"></script>
  <script src="js/ambience.js"></script>
  <script src="js/splash.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
