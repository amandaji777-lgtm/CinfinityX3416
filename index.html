<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="拾光">
  <meta name="theme-color" content="#faf7f0">
  <meta name="description" content="AI 对话、记忆收藏与心情能量波动记录的个人小工作台">
  <title>拾光</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>
  <div id="ambient-corner" class="ambient-corner" aria-hidden="true"></div>

  <div id="splash-screen" class="splash-screen" aria-hidden="true">
    <canvas id="splash-canvas"></canvas>
    <div class="splash-content">
      <div class="splash-badge">
        <svg class="splash-ring" viewBox="0 0 300 300" aria-hidden="true">
          <defs>
            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f2a7c4"/>
              <stop offset="100%" stop-color="#b7a8d6"/>
            </linearGradient>
            <path id="loopL" d="M174,150 A82,82 0 1,1 10,150 A82,82 0 1,1 174,150"/>
            <path id="loopR" d="M290,150 A82,82 0 1,1 126,150 A82,82 0 1,1 290,150"/>
            <path d="M0,-5 C1,-1.2 1.2,-1 5,0 C1.2,1 1,1.2 0,5 C-1,1.2 -1.2,1 -5,0 C-1.2,-1 -1,-1.2 0,-5 Z" id="sparkleShape"/>
          </defs>
          <circle cx="92" cy="150" r="82" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.4"/>
          <circle cx="208" cy="150" r="82" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.4"/>
          <use href="#sparkleShape" fill="#fff" opacity="0.95">
            <animateMotion dur="4.5s" repeatCount="indefinite" rotate="auto">
              <mpath href="#loopL"/>
            </animateMotion>
          </use>
          <use href="#sparkleShape" fill="#f2a7c4" opacity="0.9">
            <animateMotion dur="4.5s" repeatCount="indefinite" rotate="auto">
              <mpath href="#loopR"/>
            </animateMotion>
          </use>
        </svg>
        <svg class="splash-scene" viewBox="0 0 300 300">
          <defs>
            <radialGradient id="skyGrad" cx="42%" cy="35%" r="75%">
              <stop offset="0%" stop-color="#2c2657"/>
              <stop offset="100%" stop-color="#15122c"/>
            </radialGradient>
            <linearGradient id="planetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#d9c2ea"/>
              <stop offset="100%" stop-color="#7d6a9e"/>
            </linearGradient>
            <clipPath id="frameClip"><circle cx="110" cy="110" r="88"/></clipPath>
          </defs>

          <g transform="translate(40,40)">
          <circle cx="110" cy="110" r="88" fill="url(#skyGrad)"/>
          <circle cx="110" cy="110" r="88" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>

          <g clip-path="url(#frameClip)">
            <circle cx="50" cy="52" r="1.3" fill="#fff" opacity="0.8"/>
            <circle cx="150" cy="40" r="1" fill="#fff" opacity="0.6"/>
            <circle cx="168" cy="70" r="1.4" fill="#fff" opacity="0.7"/>
            <circle cx="40" cy="86" r="1" fill="#fff" opacity="0.5"/>
            <circle cx="128" cy="34" r="0.9" fill="#fff" opacity="0.6"/>
            <circle cx="76" cy="30" r="1.1" fill="#fff" opacity="0.5"/>

            <ellipse cx="112" cy="196" rx="98" ry="16" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" transform="rotate(-7 112 196)"/>
            <circle cx="110" cy="207" r="74" fill="url(#planetGrad)"/>
            <path d="M 46,190 Q 90,178 110,182 Q 96,192 46,190 Z" fill="rgba(255,255,255,0.12)"/>

            <g transform="translate(86,150) rotate(4)">
              <path d="M -14,21 C -15,3 -10,-15 0,-17 C 10,-15 15,3 14,21 C 14,27 -14,27 -14,21 Z" fill="#20202e" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
              <polygon points="-9,-14 -13,-25 -3,-16" fill="#20202e"/>
              <polygon points="9,-14 13,-25 3,-16" fill="#20202e"/>
              <path d="M 13,17 C 24,16 27,6 20,-1 C 17,-4 15,1 17,7" fill="none" stroke="#20202e" stroke-width="4" stroke-linecap="round"/>
              <path d="M -7,-3 Q -5,0 -3,-3" fill="none" stroke="#f4eefa" stroke-width="1.3" stroke-linecap="round"/>
              <path d="M 3,-3 Q 5,0 7,-3" fill="none" stroke="#f4eefa" stroke-width="1.3" stroke-linecap="round"/>
            </g>

            <g transform="translate(129,153) rotate(-6) scale(0.92)">
              <path d="M -14,21 C -15,3 -10,-15 0,-17 C 10,-15 15,3 14,21 C 14,27 -14,27 -14,21 Z" fill="#f6f1e9" stroke="rgba(0,0,0,0.14)" stroke-width="1"/>
              <polygon points="-9,-14 -13,-25 -3,-16" fill="#f6f1e9" stroke="rgba(0,0,0,0.14)" stroke-width="1"/>
              <polygon points="9,-14 13,-25 3,-16" fill="#f6f1e9" stroke="rgba(0,0,0,0.14)" stroke-width="1"/>
              <path d="M -13,17 C -24,16 -27,6 -20,-1 C -17,-4 -15,1 -17,7" fill="none" stroke="#f6f1e9" stroke-width="4" stroke-linecap="round"/>
              <path d="M -7,-3 Q -5,0 -3,-3" fill="none" stroke="#2a2430" stroke-width="1.3" stroke-linecap="round"/>
              <path d="M 3,-3 Q 5,0 7,-3" fill="none" stroke="#2a2430" stroke-width="1.3" stroke-linecap="round"/>
            </g>
          </g>
          </g>
        </svg>
      </div>
      <div class="splash-welcome">Welcome back</div>
      <div class="splash-sub">拾光 · 对话 · 收藏 · 心情</div>
    </div>
    <button id="splash-skip" class="splash-skip">跳过</button>
  </div>

  <div id="wizard-root"></div>

  <div id="app-shell" class="app-shell">
    <div id="offline-banner" class="offline-banner">当前处于离线状态，本地记录仍可正常查看和编辑，AI 对话需要联网。</div>

    <main class="app-main">
      <section id="view-chat" class="view active"></section>
      <section id="view-bookmarks" class="view"></section>
      <section id="view-mood" class="view"></section>
      <section id="view-more" class="view"></section>
      <section id="view-resources" class="view"></section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn" data-tab="chat" title="对话" aria-label="对话">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="7.5"/>
        </svg></span>
      </button>
      <button class="nav-btn" data-tab="bookmarks" title="收藏" aria-label="收藏">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg></span>
      </button>
      <button class="nav-btn" data-tab="mood" title="心情" aria-label="心情">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="7.5" fill="currentColor" opacity="0.12" stroke="none"/>
          <circle cx="12" cy="12" r="7.5"/>
          <circle cx="9.2" cy="9.4" r="0.9" opacity="0.55"/>
          <circle cx="14.6" cy="13.1" r="0.6" opacity="0.45"/>
          <circle cx="10.4" cy="14.6" r="0.45" opacity="0.45"/>
        </svg></span>
      </button>
      <button class="nav-btn" data-tab="more" title="更多" aria-label="更多">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <g transform="scale(-1,1) translate(-24,0)"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></g>
        </svg></span>
      </button>
    </nav>
  </div>

  <script src="js/db.js"></script>
  <script src="js/crypto-utils.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/wizard.js"></script>
  <script src="js/resources.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/memory.js"></script>
  <script src="js/proactive.js"></script>
  <script src="js/linkstatus.js"></script>
  <script src="js/bookmarks.js"></script>
  <script src="js/mood.js"></script>
  <script src="js/more.js"></script>
  <script src="js/ambience.js"></script>
  <script src="js/splash.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
