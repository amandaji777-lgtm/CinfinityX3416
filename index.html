<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
  <script>
    // 100dvh 在部分内嵌浏览器/WebView 里算不准（尤其带自己地址栏/工具栏的第三方浏览器
    // 打开我们这个网页时），真机上多次反馈过"更多"页内容显示不全就是这个原因——
    // 用 JS 实测 window.innerHeight 写一个 --vh 自定义属性兜底，比单纯信 dvh 更可靠。
    // 必须在 <head> 里内联执行、越早越好，赶在首次绘制之前把值准备好。
    (function () {
      function setVh() { document.documentElement.style.setProperty('--vh', window.innerHeight * 0.01 + 'px'); }
      setVh();
      window.addEventListener('resize', setVh);
      window.addEventListener('orientationchange', setVh);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', setVh);
    })();
  </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="星纪">
  <meta name="theme-color" content="#faf7f0">
  <meta name="description" content="AI 对话、记忆收藏与心情能量波动记录的个人小工作台">
  <title>星纪</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="wallpaper-layer" aria-hidden="true"></div>
  <div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

  <div id="splash-screen" class="splash-screen" aria-hidden="true">
    <div id="splash-photo-bg" class="splash-photo-bg"></div>
    <canvas id="splash-canvas"></canvas>
    <div class="splash-veil"></div>
    <div id="splash-datetime" class="splash-datetime">
      <div id="splash-date" class="splash-date"></div>
      <div id="splash-time" class="splash-time"></div>
    </div>
    <div class="splash-content">
      <div id="splash-welcome" class="splash-welcome">Welcome Home</div>
    </div>
    <div id="splash-home" class="splash-home">
      <svg class="splash-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
      <div class="splash-hint">向上轻滑以进入</div>
      <div class="splash-bar"></div>
    </div>
  </div>

  <div id="page-stack" class="page-stack"></div>

  <div id="app-shell" class="app-shell">
    <div id="offline-banner" class="offline-banner">当前处于离线状态，本地记录仍可正常查看和编辑，AI 对话需要联网。</div>

    <main class="app-main">
      <section id="view-chat" class="view active"></section>
      <section id="view-bookmarks" class="view"></section>
      <section id="view-mood" class="view"></section>
      <section id="view-calendar" class="view"></section>
      <section id="view-more" class="view"></section>
      <section id="view-resources" class="view"></section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn" data-tab="bookmarks" title="Memory" aria-label="Memory">
        <span class="nav-icon"><span class="nav-icon-img nav-icon-bookmarks"></span></span>
      </button>
      <button class="nav-btn" data-tab="mood" title="Mood" aria-label="Mood">
        <span class="nav-icon"><span class="nav-icon-img nav-icon-mood"></span></span>
      </button>
      <button class="nav-btn nav-btn-center" data-tab="chat" title="Home" aria-label="Home">
        <span class="nav-icon"><span class="nav-icon-img nav-icon-home"></span></span>
      </button>
      <button class="nav-btn" data-tab="calendar" title="Calendar" aria-label="Calendar">
        <span class="nav-icon"><span class="nav-icon-img nav-icon-calendar"></span></span>
      </button>
      <button class="nav-btn" data-tab="more" title="Settings" aria-label="Settings">
        <span class="nav-icon"><span class="nav-icon-img nav-icon-more"></span></span>
      </button>
    </nav>
  </div>

  <button id="silentsync-btn" class="silentsync-btn" type="button" title="静默同频" aria-label="静默同频">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12.5h4l2 6.5 4-15 2 8.5h6.5"/></svg>
  </button>
  <div id="silentsync-overlay" class="silentsync-overlay" aria-hidden="true">
    <div class="silentsync-emblem">
      <div class="silentsync-glow"></div>
      <div class="silentsync-ring"></div>
      <div class="silentsync-moon"></div>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/crypto-utils.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/ui-dialog.js"></script>
  <script src="js/wallpaper.js"></script>
  <script src="js/splash-photo.js"></script>
  <script src="js/avatars.js"></script>
  <script src="js/resources.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/memory.js"></script>
  <script src="js/proactive.js"></script>
  <script src="js/linkstatus.js"></script>
  <script src="js/bookmarks.js"></script>
  <script src="js/mood.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/more.js"></script>
  <script src="js/ambience.js"></script>
  <script src="js/silentsync.js"></script>
  <script src="js/splash.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
